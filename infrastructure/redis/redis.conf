# Redis Configuration for DEVFLOW AI
bind 0.0.0.0
port 6379
tcp-backlog 511
timeout 0
tcp-keepalive 300

# Memory Management
maxmemory 2gb
maxmemory-policy volatile-lru

# Persistence (AOF + RDB)
save 900 1
save 300 10
save 60 10000
stop-writes-on-bgsave-error yes
rdbcompression yes
dbfilename dump.rdb
dir /data

appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec

# Performance & Latency
latency-monitor-threshold 100
slowlog-log-slower-than 10000
slowlog-max-len 128
