version: '3.8'

networks:
  devflow-prod-net:
    driver: bridge

volumes:
  pgdata-prod:
    driver: local
  redisdata-prod:
    driver: local
  kafkadata-prod:
    driver: local
  zookeeperdata-prod:
    driver: local
  prometheusdata-prod:
    driver: local
  grafanadata-prod:
    driver: local

services:
  # ==========================================
  # Database: PostgreSQL 16 + pgvector (HNSW)
  # ==========================================
  postgres:
    image: pgvector/pgvector:pg16
    container_name: devflow-postgres-prod
    restart: unless-stopped
    networks:
      - devflow-prod-net
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-devflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devflow_prod_secure_pass_2026}
      POSTGRES_DB: ${POSTGRES_DB:-devflow_db}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - pgdata-prod:/var/lib/postgresql/data
      - ./infrastructure/postgres/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./infrastructure/postgres/optimizations.sql:/docker-entrypoint-initdb.d/02_optimizations.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-devflow} -d ${POSTGRES_DB:-devflow_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4096M

  # ==========================================
  # Cache & Presence: Redis 7.2
  # ==========================================
  redis:
    image: redis:7-alpine
    container_name: devflow-redis-prod
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 1024mb --maxmemory-policy allkeys-lru
    networks:
      - devflow-prod-net
    volumes:
      - redisdata-prod:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1024M

  # ==========================================
  # Event Bus: Zookeeper & Apache Kafka
  # ==========================================
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: devflow-zookeeper-prod
    restart: unless-stopped
    networks:
      - devflow-prod-net
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeperdata-prod:/var/lib/zookeeper/data
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1024M

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: devflow-kafka-prod
    restart: unless-stopped
    depends_on:
      - zookeeper
    networks:
      - devflow-prod-net
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafkadata-prod:/var/lib/kafka/data
    ports:
      - "9092:9092"
      - "29092:29092"
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 9092 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M

  # ==========================================
  # AI Engine: FastAPI / PyTorch RAG Service
  # ==========================================
  ai-service:
    build:
      context: ./apps/ai-service
      dockerfile: Dockerfile
    container_name: devflow-ai-service-prod
    restart: unless-stopped
    networks:
      - devflow-prod-net
    environment:
      ENVIRONMENT: production
      PORT: 8000
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgresql://${POSTGRES_USER:-devflow}:${POSTGRES_PASSWORD:-devflow_prod_secure_pass_2026}@postgres:5432/${POSTGRES_DB:-devflow_db}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4096M

  # ==========================================
  # API Gateway & Monolith: NestJS API
  # ==========================================
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: devflow-api-prod
    restart: unless-stopped
    networks:
      - devflow-prod-net
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-devflow}:${POSTGRES_PASSWORD:-devflow_prod_secure_pass_2026}@postgres:5432/${POSTGRES_DB:-devflow_db}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-devflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devflow_prod_secure_pass_2026}
      POSTGRES_DB: ${POSTGRES_DB:-devflow_db}
      REDIS_URL: redis://redis:6379
      KAFKA_BROKERS: kafka:9092
      AI_SERVICE_URL: http://ai-service:8000
      JWT_SECRET: ${JWT_SECRET:-devflow_prod_jwt_super_secret_key_2026}
      JWT_EXPIRES_IN: 15m
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-devflow_prod_jwt_refresh_secret_key_2026}
      JWT_REFRESH_EXPIRES_IN: 7d
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      ai-service:
        condition: service_started
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M

  # ==========================================
  # Frontend Cockpit: Next.js 14 Web
  # ==========================================
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: devflow-web-prod
    restart: unless-stopped
    networks:
      - devflow-prod-net
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_URL: http://localhost:4000
      NEXT_PUBLIC_WS_URL: ws://localhost:4000
    ports:
      - "3000:3000"
    depends_on:
      - api
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1536M

  # ==========================================
  # Observability: Prometheus & Grafana
  # ==========================================
  prometheus:
    image: prom/prometheus:v2.48.0
    container_name: devflow-prometheus-prod
    restart: unless-stopped
    networks:
      - devflow-prod-net
    volumes:
      - ./infrastructure/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheusdata-prod:/prometheus
    ports:
      - "9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  grafana:
    image: grafana/grafana:10.2.0
    container_name: devflow-grafana-prod
    restart: unless-stopped
    networks:
      - devflow-prod-net
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-devflow_grafana_2026}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafanadata-prod:/var/lib/grafana
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
